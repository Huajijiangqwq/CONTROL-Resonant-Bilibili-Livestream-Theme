<!doctype html>
<html lang="zh-CN" data-studio="fleet"><head><script src="runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>舰队加入 · 开通提示</title><link rel="stylesheet" href="levitation.css"><link rel="stylesheet" href="studio-ui.css"></head>
<body>
<header><a class="brand" href="simulation.html?mode=sc"><span class="triangle">▽</span><span>异常通讯 <small>舰队加入提示 / FLEET</small></span></a><nav><a href="simulation.html?mode=fleet">弹幕模拟</a><a href="simulation.html?mode=sc">SC 特效</a><button id="pure">纯画面</button></nav></header>
<main><aside aria-label="舰队提示设置">
<div class="intro"><span class="eyebrow">01 / RECONSTRUCTION</span><h1>舰队加入</h1><p>冷白碎光扩散，舰队徽记显形。<br>沿用原片碎光，三级入场各有节奏。</p></div>
<section><h2>提示内容</h2><label>舰队等级<select id="rank"><option value="captain">舰长</option><option value="admiral">提督</option><option value="governor">总督</option></select></label><label>开通提示<input id="title" value="开通舰长" readonly></label><label>用户名<input id="subtitle" value="调查员 07" maxlength="30" autocomplete="off"></label><p class="field-note">粗字：开通等级　细字：用户名</p></section>
<section><h2>播放</h2><div class="buttons"><button id="replay" class="primary">重新播放</button><button id="pause">暂停</button></div><label>播放速度<select id="speed"><option value="1">正常速度 · 1×</option><option value="0.5">慢放 · 0.5×</option><option value="0.25">逐段观察 · 0.25×</option></select></label><label class="check"><input id="loop" type="checkbox">连续重播入场</label><p class="field-note">显形后保留微光；暂停可定格，重新播放可再看一次。</p></section>
<section><h2>画面</h2><div data-frame-rate></div><label>查看范围<select id="view"><option value="detail">提示特写</option><option value="full">16:9 全画面位置</option></select></label><label>背景<select id="background"><option value="chat">弹幕区示例</option><option value="game">游戏示例</option><option value="dark">深色</option><option value="light">浅色</option><option value="transparent">透明 / 棋盘格</option></select></label><label>提示尺寸 <output id="scaleValue">100%</output><input id="scale" type="range" min="60" max="160" step="5" value="100"></label></section>
<p class="note">原片碎光、程序细光与显形瞬间的局部错帧。本地预览，无需连接直播平台。</p>
</aside>
<section class="preview" aria-label="舰队提示预览"><div class="preview-top"><span id="viewLabel">提示特写</span><span id="ready" role="status">正在载入动态材质…</span></div><div id="stage" class="stage"><div id="canvasShell" class="canvas-shell"><canvas id="screen" role="img" aria-label="开通舰长，调查员 07；舰队加入动画"></canvas></div></div><div class="transport"><div class="timeline-head"><span id="phase">准备</span><output id="time">0.00 / 2.00 s</output></div><label class="sr-only" for="timeline">动画进度</label><input id="timeline" type="range" min="0" max="2000" step="1" value="0"><div class="marks"><button data-time="80">轮廓</button><button data-time="210">蓄能</button><button data-time="290">闪现</button><button data-time="burn" id="burnMark" hidden>漏光</button><button data-time="fbc" id="fbcMark" hidden>FBC</button><button data-time="550">扩散</button><button data-time="1800">稳定</button></div></div></section></main>
<button id="back" class="pure-back">显示设置 · Esc</button><video id="burst" muted playsinline preload="auto" hidden></video><script src="frame-rate.js"></script><script src="fleet-film-burn.js?v=idle-audio-v62-4"></script><script src="fleet-interlude.js?v=idle-audio-v62-4"></script><script src="fleet-vhs.js?v=fleet-tail-v73-1"></script><script src="fleet-signal.js?v=fleet-tail-v73-1"></script><script src="fleet-notice-engine.js?v=idle-audio-v62-4"></script><script src="levitation.js?v=idle-audio-v62-4"></script>
</body></html>
