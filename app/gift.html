<!doctype html>
<html lang="zh-CN" data-studio="gift"><head><script src="runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>异化物档案 · 礼物入场</title><link rel="stylesheet" href="gift.css"><link rel="stylesheet" href="studio-ui.css"></head>
<body><header><a class="brand" href="simulation.html?mode=gift"><span>▽</span> 异常通讯 <small>异化物档案</small></a><nav><a href="simulation.html?mode=gift">弹幕模拟</a><a href="levitation.html">舰队提示</a><button id="pure">纯画面</button></nav></header>
<main><aside aria-label="礼物档案设置"><div class="intro"><span class="eyebrow">礼物提示 / 01</span><h1>档案显影</h1><p>纸面形成，遮盖条退开，物证显影。<br>带一点定格的停顿，约 0.8 秒后落定。</p></div>
<section><h2>异化物信息</h2><label>礼物名称<input id="giftName" value="礼物名称" maxlength="60" autocomplete="off"></label><label>赠送者<input id="sender" value="调查员 07" maxlength="50" autocomplete="off"></label><div class="pair"><label>数量<input id="quantity" type="number" min="1" max="999999" step="1" value="10"></label><label>总价值（电池）<input id="value" type="number" min="0" max="999999999" step="1" value="1000"></label></div><p class="hint">价值为这一组礼物的总电池数，可自由填写。</p></section>
<section><h2>播放入场</h2><div class="buttons"><button class="primary" id="replay">重新播放</button><button id="pause">暂停</button></div><label>播放速度<select id="speed"><option value="1">正常 · 1×</option><option value="0.5">慢放 · 0.5×</option><option value="0.25">逐段观察 · 0.25×</option></select></label><label class="check"><input id="loop" type="checkbox">循环播放</label><button id="combo">模拟连击 · 数量 +1</button><p class="hint">连击只更新数量和价值；按当前单份均价累加。</p></section>
<section><h2>画面</h2><div data-frame-rate></div><label>弹幕栏宽度<select id="width"><option value="340">340 px · 窄栏</option><option value="440" selected>440 px · 默认</option><option value="600">600 px · 宽栏</option></select></label><label>查看方式<select id="view"><option value="detail">放大观察</option><option value="actual">实际大小</option></select></label></section><p class="hint">仅本地特效预览，无需接入直播平台。</p></aside>
<section class="preview" aria-label="礼物档案动画"><div class="preview-top"><span>礼物 · 异化物档案</span><span id="ready" role="status">正在准备物证照片…</span></div><div class="stage" id="stage"><div id="canvasShell"><canvas id="screen" role="img" aria-label="礼物名称，调查员 07，10 份，价值 1000 电池"></canvas></div></div><div class="transport"><div class="timeline-head"><span id="phase">纸面轮廓</span><output id="time">0 / 800 ms</output></div><label class="sr-only" for="timeline">动画进度</label><input id="timeline" type="range" min="0" max="800" step="1" value="0"><div class="marks"><button data-time="0">轮廓</button><button data-time="90">曝光</button><button data-time="240">揭开</button><button data-time="400">显影</button><button data-time="580">展开</button><button data-time="800">落定</button></div></div></section></main><button id="back" class="pure-back">显示设置 · Esc</button>
<script src="frame-rate.js"></script><script src="gift-notice-engine.js?v=gift-layout-cache-20260915-1"></script><script src="gift.js?v=preview-data-cache-20260915-1"></script></body></html>
