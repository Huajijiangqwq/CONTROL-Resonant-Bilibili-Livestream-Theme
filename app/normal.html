<!doctype html>
<html lang="zh-CN" data-studio="normal"><head><script src="remedy-presets.js"></script><script src="runtime-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>普通弹幕 · 通讯记录写入</title><link rel="stylesheet" href="gift.css"><link rel="stylesheet" href="normal.css"><link rel="stylesheet" href="studio-ui.css"></head>
<body><header><a class="brand" href="simulation.html?mode=normal"><span>▽</span> 异常通讯 <small>普通弹幕</small></a><nav><a href="simulation.html?mode=normal">弹幕模拟</a><a href="gift.html">礼物档案</a><button id="pure">纯画面</button></nav></header>
<main><aside aria-label="普通弹幕设置"><div class="intro"><span class="eyebrow">普通弹幕 / 02</span><h1>通讯记录写入</h1><p>三角转动，署名显露，正文两拍落定。<br>约 0.22 秒，保留轻微的机械停顿。</p></div>
<section><h2>消息内容</h2><label>发送者<input id="sender" value="小北" maxlength="50" autocomplete="off"></label><label>弹幕正文<textarea id="message" rows="4" maxlength="300">欢迎来到太古屋
先看看前面的门。</textarea></label><p class="hint">正文按整行显露，多行只略微错开。</p></section>
<section><h2>播放入场</h2><div class="buttons"><button id="replay" class="primary">重新播放</button><button id="pause">暂停</button></div><label>播放速度<select id="speed"><option value="1">正常 · 1×</option><option value="0.5">慢放 · 0.5×</option><option value="0.25">逐段观察 · 0.25×</option><option value="0.1">仔细观察 · 0.1×</option></select></label><label class="check"><input id="loop" type="checkbox">循环播放</label></section>
<section><h2>画面</h2><div data-frame-rate></div><label>弹幕栏宽度<select id="width"><option value="340">340 px · 窄栏</option><option value="440" selected>440 px · 默认</option><option value="600">600 px · 宽栏</option></select></label><label>正文字号<select id="fontSize"><option value="16">16 px</option><option value="21" selected>21 px</option><option value="28">28 px</option></select></label><label>查看方式<select id="view"><option value="detail">放大观察</option><option value="actual">实际大小</option></select></label></section><p class="hint">此处观察单条入场；在弹幕模拟中检查连续消息与滚动。仅本地预览。</p></aside>
<section class="preview" aria-label="普通弹幕入场预览"><div class="preview-top"><span>普通弹幕 · 三角转动与正文两拍</span><span>本地预览</span></div><div id="stage" class="stage"><div id="canvasShell"><canvas id="screen" role="img" aria-label="普通弹幕动画"></canvas></div></div><div class="transport"><div class="timeline-head"><span id="phase">信号待入</span><output id="time">0 / 220 ms</output></div><label class="sr-only" for="timeline">动画进度</label><input id="timeline" type="range" min="0" max="220" step="1" value="0"><div class="marks"><button data-time="0">待入</button><button data-time="45">旋转</button><button data-time="90">第一拍</button><button data-time="135">第二拍</button><button data-time="175">分隔线</button><button data-time="220">落定</button></div></div></section></main><button id="back" class="pure-back">显示设置 · Esc</button>
<script src="frame-rate.js"></script><script src="normal-notice-engine.js?v=normal-name-edge-20260915-1"></script><script src="normal.js"></script></body></html>
