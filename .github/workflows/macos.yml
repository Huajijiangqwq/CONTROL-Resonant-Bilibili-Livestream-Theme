name: Build macOS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Native macOS ${{ matrix.arch }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm native architecture
        run: node -e 'if(process.platform!=="darwin" || process.arch!==process.argv[1])process.exit(1)' '${{ matrix.arch }}'
      - run: npm run check
      - run: npm test
      - name: Build and verify native ZIP and DMG
        run: npm run build:mac -- --arch=${{ matrix.arch }}
      - name: Launch packaged app and verify visible UI
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/control-resonant-smoke-${{ matrix.arch }}"
          mkdir -p "$stage"
          ditto -x -k "dist/ControlResonant-$(node -p 'require("./package.json").version')-mac-${{ matrix.arch }}.zip" "$stage"
          bundle=$(find "$stage" -maxdepth 2 -name 'Control Resonant.app' -type d -print -quit)
          test -n "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          node scripts/smoke-mac.js --bundle "$bundle" --output "mac-verification/${{ matrix.arch }}"
      - name: Upload verification report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mac-verification-${{ matrix.arch }}
          path: mac-verification/${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare self-contained download and checksums
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          artifacts="mac-distribution/${{ matrix.arch }}"
          mkdir -p "$artifacts"
          cp "dist/ControlResonant-$version-mac-${{ matrix.arch }}.zip" "$artifacts/"
          cp "dist/ControlResonant-$version-mac-${{ matrix.arch }}.dmg" "$artifacts/"
          (
            cd "$artifacts"
            shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt
          )
      - name: Upload distribution after all checks pass
        uses: actions/upload-artifact@v4
        with:
          name: ControlResonant-mac-${{ matrix.arch }}
          path: mac-distribution/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30
