name: Build macOS Beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run check
      - run: npm test
      - run: npm run build:mac -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ControlResonant-mac-${{ matrix.arch }}
          path: dist/ControlResonant-*-mac-*.zip
          if-no-files-found: error
